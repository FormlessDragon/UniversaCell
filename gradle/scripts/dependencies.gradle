apply from: 'gradle/scripts/helpers.gradle'

repositories {
    flatDir {
        dirs('libs') // /libs
    }
    maven {
        name = 'CleanroomMC'
        url = 'https://maven.cleanroommc.com'
        content {
            includeGroup 'mezz'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'CleanroomCurseMaven'
        url = 'https://curse.cleanroommc.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        url = 'https://jitpack.io'
    }
    mavenCentral()
    mavenLocal() // Must be last for caching to work
}

dependencies {
    modImplementation 'mezz:jei:4.36.1'

    modImplementation "com.github.FormlessDragon:Applied-Energistics-2-Supergiant:v1.1.0:dev"
    modCompileOnly 'curse.maven:baubles-227083:2518667'
    modImplementation "com.github.FormlessDragon:MEGACells:v1.0.0:dev"
    compileOnly 'org.jetbrains:annotations:26.0.2'
}

if (propertyBool('enable_shadow')) {
    tasks.named("shadowJar").configure {
        // Exclude specific parts of deps to keep your jar clean
        // dependencies {
        //     exclude 'META-INF/maven/**'
        // }

        // Relocate specific parts of deps, so multiple shaded classes in mods will not conflict
        // relocate "mezz.jei", "shaded.mezz.jei"

        // Remove unused classes automatically. May cause issues if they are accessed by reflection
        // minimize()
    }
}
